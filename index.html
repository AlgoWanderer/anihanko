<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AniHanko: browse, search and discover anime. Airing schedule, top 100, seasonal charts and more." />
    <title>AniHanko</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      // Apply the saved theme (light, dark or sea) before React loads, so the page doesn't flash.
      try {
        const saved = localStorage.getItem('theme')
        const theme = saved === 'light' || saved === 'dark' || saved === 'sea'
          ? saved
          : window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        if (theme !== 'light') document.documentElement.classList.add(theme)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
